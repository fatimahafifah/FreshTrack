
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Inventory | FreshTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #315C45;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">FreshTrack</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="inventory.html">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="expiry.html">Expiry Tracker</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container py-5">

        <div class="mb-4">
            <h2 class="fw-bold">Food Inventory</h2>
            <p class="text-muted">Manage and keep track of your food items.</p>
        </div>

        <!-- ADD FOOD FORM -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-3">Add New Food</h5>

                <form id="foodForm">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Food Name</label>
                            <input type="text" id="foodName" class="form-control"
                                placeholder="Enter food name" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Category</label>
                            <select id="foodCategory" class="form-select" required>
                                <option value="">Select category</option>
                                <option value="Vegetables">Vegetables</option>
                                <option value="Fruits">Fruits</option>
                                <option value="Dairy">Dairy</option>
                                <option value="Meat">Meat</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Quantity</label>
                            <input type="number" id="foodQuantity" class="form-control"
                                min="1" placeholder="1" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" id="foodExpiry" class="form-control" required>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success mt-4">
                        Add Food
                    </button>

                    <div id="foodMessage" class="mt-3"></div>

                </form>

            </div>
        </div>

        <!-- FOOD LIST -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-3">My Food Items</h5>

        <!-- SEARCH FOOD -->
        <div class="mb-3">
            <input
                type="text"
                id="searchFood"
                class="form-control"
                placeholder="Search food by name..."
            >
        </div>

       <!-- FILTER CATEGORY -->
       <div class="mb-3">
           <select id="filterCategory" class="form-select">
               <option value="">All Categories</option>
               <option value="Vegetables">Vegetables</option>
               <option value="Fruits">Fruits</option>
               <option value="Dairy">Dairy</option>
               <option value="Meat">Meat</option>
               <option value="Others">Others</option>
           </select>
       </div>

               <div class="table-responsive">
                   <table class="table table-hover align-middle">

                       <thead>
                           <tr>
                               <th>Food Name</th>
                               <th>Category</th>
                              <th>Quantity</th>
                               <th>Expiry Date</th>
                               <th>Action</th>
                           </tr>
                       </thead>

                       <tbody id="foodTable">
                           <tr>
                               <td colspan="5" class="text-center text-muted">
                                   No food items added yet.
                               </td>
                           </tr>
                       </tbody>

                   </table>
               </div>

            </div>
       </div>
       
 </div>

    <footer class="text-center py-3 text-muted">
        <small>© 2026 FreshTrack. Food Management System.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>

</body>
</html>
