
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | FreshTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #315C45;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">FreshTrack</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="expiry.html">Expiry Tracker</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reports.html">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container py-5">

        <div class="mb-4">
            <h2 class="fw-bold">Reports</h2>
            <p class="text-muted">View your food inventory statistics and summaries.</p>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="text-muted mb-1">Total Food Items</p>
                        <h3 class="fw-bold" id="totalCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="text-muted mb-1">Fresh Items</p>
                        <h3 class="fw-bold text-success" id="freshCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="text-muted mb-1">Expiring Soon</p>
                        <h3 class="fw-bold text-warning" id="soonCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <p class="text-muted mb-1">Expired Items</p>
                        <h3 class="fw-bold text-danger" id="expiredCount">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- FOOD CATEGORY CHART -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-3">Food Items by Category</h5>

                <canvas id="categoryChart"></canvas>

            </div>
        </div>

    </div>

    <footer class="text-center py-3 text-muted">
        <small>© 2026 FreshTrack. Food Management System.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>

</body>
</html>
